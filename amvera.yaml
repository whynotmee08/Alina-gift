---
meta:
  environment: python
  toolchain:
    name: pip
    version: latest
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  persistenceMount: /data
  command: gunicorn --bind 0.0.0.0:5000 app:app
  containerPort: 5000
  russianTrustedCa: false
  singleton: true
  zeroDowntime: false
